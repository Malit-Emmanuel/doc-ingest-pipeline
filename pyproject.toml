[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docpipe"
version = "0.1.0"
description = "Document ingestion pipeline: PDF, Word and text into PostgreSQL + pgvector for retrieval-augmented AI, with PII redaction, data-quality checks and run reconciliation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Emmanuel Malit" }]
license = { text = "MIT" }
dependencies = [
  "psycopg[binary]>=3.1",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "numpy>=1.26",
]

[project.optional-dependencies]
models = ["sentence-transformers>=2.7"]
dev = ["pytest>=8", "ruff>=0.5", "reportlab>=4.0"]

[project.scripts]
docpipe = "docpipe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docpipe = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_samples.py" = ["E501"]  # sample prose
