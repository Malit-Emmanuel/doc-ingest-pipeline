name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docpipe
          POSTGRES_PASSWORD: docpipe
          POSTGRES_DB: docpipe_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docpipe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://docpipe:docpipe@localhost:5432/docpipe_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit and database tests (pgvector and array backends)
        run: pytest -v
      - name: End-to-end run on the sample corpus (pgvector)
        env:
          DATABASE_URL: postgresql://docpipe:docpipe@localhost:5432/docpipe_test
          VECTOR_BACKEND: pgvector
        run: |
          psql "$DATABASE_URL" -c "DROP TABLE IF EXISTS quality_results, quarantine, chunks, documents, ingestion_runs CASCADE"
          docpipe ingest samples
          docpipe search "is there an early repayment penalty" -k 2
          docpipe runs -n 1
